[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-churn-prediction"
version = "1.0.0"
description = "End-to-end customer churn prediction pipeline (scikit-learn, XGBoost)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.2",
    "xgboost>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "joblib>=1.3",
    "kaggle>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
churn-download = "churn.data:download_main"
churn-eda = "churn.eda:main"
churn-train = "churn.train:main"
churn-predict = "churn.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
